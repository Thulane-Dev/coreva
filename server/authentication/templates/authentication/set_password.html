<section>
  <div
    class="card shadow-sm p-4 rounded-4"
    style="max-width: 450px; margin: auto"
  >
    <h3 class="fw-bold mb-3">Welcome 👋</h3>
    <p class="text-muted mb-4">
      Please create a password to access your contractor compliance dashboard.
    </p>

    <form method="post">
      {% csrf_token %}

      <input
        type="password"
        name="new_password1"
        class="form-control mb-3"
        placeholder="New password"
        required
      />

      <input
        type="password"
        name="new_password2"
        class="form-control mb-3"
        placeholder="Confirm password"
        required
      />

      <button class="btn btn-dark w-100">Set Password & Continue</button>
    </form>
  </div>
</section>

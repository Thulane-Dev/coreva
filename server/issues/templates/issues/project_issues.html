{% load static %}
<!-- divider  -->

<!-- =====================================
      PAGE HEADER
====================================== -->
<a href="javascript:history.back()" class="incident_back">
  <i class="bi bi-chevron-left"></i>
  <span>Back</span>
</a>

<div class="dashboard_main_card mb-3">
  <div class="form_page_header mb-0">
    <div
      class="form_page_icon"
      style="
        background-color: #fff2f2 !important;
        color: rgb(214, 57, 72) !important;
      "
    >
      <i class="bi bi-exclamation-triangle-fill"></i>
    </div>

    <div class="d-flex justify-content-between w-100">
      <div>
        <div class="form_page_eyebrow">PROJECT</div>
        <h1 class="form_page_title">Project Issues</h1>
        <p class="form_page_subtitle mb-0">
          Record an issue that needs attention, tracking or resolution.
        </p>
      </div>
      <div class="d-none d-md-block">
        <a href="{% url 'issues:log-issue' project.uuid %}">
          <button type="button" class="project_quick_action primary">
            <span class="project_quick_action_icon">
              <i class="bi bi-plus-lg"></i>
            </span>
            <span class="project_quick_action_text"> Add Issue</span>
          </button>
        </a>
      </div>
    </div>
  </div>
</div>

<section class="d-block d-md-none">
  <a href="{% url 'issues:log-issue' project.uuid %}">
    <button type="button" class="project_quick_action primary mb-3">
      <span class="project_quick_action_icon">
        <i class="bi bi-plus-lg"></i>
      </span>
      <span class="project_quick_action_text"> Add Issue</span>
    </button>
  </a>
</section>

<!-- ======== ISSUES ======== -->
<section class="issues-filters mb-4">
  <form action="">
    {% csrf_token %}
    <div class="issues-filters-inner">
      <!-- Search -->
      <div class="issues-search">
        <i class="bi bi-search"></i>
        <input
          type="search"
          class="form-control"
          placeholder="Search issues..."
          aria-label="Search issues"
          name="query"
          hx-post="{% url 'issues:filter-issues' project.uuid %}"
          hx-trigger="keyup changed delay:300ms"
          hx-target="#issues_partial"
          hx-indicator=".loading"
          hx-swap="innerHTML"
        />
      </div>

      <!-- Filters -->
      <div class="issues-filter-group">
        <!-- Status -->
        <div class="issue-filter">
          <label for="statusFilter">Status</label>
          <select id="statusFilter" class="form-select">
            <option selected>All statuses</option>
            <option value="open">Open</option>
            <option value="in_progress">In Progress</option>
            <option value="resolved">Resolved</option>
            <option value="closed">Closed</option>
          </select>
        </div>

        <!-- Priority -->
        <div class="issue-filter">
          <label for="priorityFilter">Priority</label>
          <select id="priorityFilter" class="form-select">
            <option selected>All priorities</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>

        <!-- Assignee -->
        <div class="issue-filter">
          <label for="assigneeFilter">Assigned to</label>
          <select id="assigneeFilter" class="form-select">
            <option selected>Everyone</option>
            <option value="unassigned">Unassigned</option>
            <option value="me">Assigned to me</option>
          </select>
        </div>

        <!-- More -->
        <button
          type="button"
          class="issues-more-btn"
          data-bs-toggle="collapse"
          data-bs-target="#moreIssueFilters"
          aria-expanded="false"
        >
          <i class="bi bi-sliders2"></i>
          <span>More filters</span>
          <i class="bi bi-chevron-down filter-chevron"></i>
        </button>
      </div>

      <!-- More Filters -->
      <div class="collapse" id="moreIssueFilters">
        <div class="more-filters">
          <div class="issue-filter">
            <label for="dateFilter">Date</label>
            <select id="dateFilter" class="form-select">
              <option selected>Any date</option>
              <option value="today">Created today</option>
              <option value="week">Created this week</option>
              <option value="updated">Recently updated</option>
            </select>
          </div>

          <div class="issue-filter">
            <label for="commentFilter">Comments</label>
            <select id="commentFilter" class="form-select">
              <option selected>All comments</option>
              <option value="unread">Unread comments</option>
            </select>
          </div>

          <button type="button" class="clear-filters-btn">Clear filters</button>
        </div>
      </div>
    </div>
  </form>
</section>

<!-- ======== ISSUES ======== -->
<section class="section-spacing">
  <div id="issues_partial">
    {% include 'partials/all_issues_partial.html' %}
  </div>
</section>

<style>
  /* ========================================
   ISSUE CARD
======================================== */

  .issue-card {
    background: #ffffff;
    border: 1px solid #e9ecef;
    border-radius: 16px;
    padding: 18px;
    transition: all 0.2s ease;
  }

  .issue-card:hover {
    border-color: #d9dee3;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
  }

  /* ========================================
   HEADER
======================================== */

  .issue-card-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }

  .issue-icon {
    width: 42px;
    height: 42px;
    min-width: 42px;
    border-radius: 12px;
    background: #fff1f1;
    color: #dc3545;

    display: flex;
    align-items: center;
    justify-content: center;
  }

  .issue-icon .material-symbols-outlined {
    font-size: 21px;
  }

  /* ========================================
   MAIN CONTENT
======================================== */

  .issue-main {
    min-width: 0;
    flex: 1;
  }

  .issue-title-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .issue-title {
    color: #202428;
    font-size: 15px;
    line-height: 1.4;
    font-weight: 700;
  }

  /* ========================================
   PRIORITY BADGES
======================================== */

  .issue-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;

    padding: 4px 9px;
    border-radius: 999px;

    font-size: 11px;
    font-weight: 700;
    line-height: 1;
    white-space: nowrap;
  }

  .priority-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    display: inline-block;
  }

  .priority-high {
    background: #fff0f1;
    color: #c92a3a;
  }

  .priority-high .priority-dot {
    background: #dc3545;
  }

  .priority-medium {
    background: #fff7df;
    color: #9a7000;
  }

  .priority-medium .priority-dot {
    background: #e5a900;
  }

  .priority-low {
    background: #eaf8ef;
    color: #258348;
  }

  .priority-low .priority-dot {
    background: #2eaa5b;
  }

  /* ========================================
   DESCRIPTION
======================================== */

  .issue-description {
    color: #6c757d;
    font-size: 14px;
    line-height: 1.55;
    margin-top: 7px;
  }

  /* ========================================
   META
======================================== */

  .issue-meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 12px;
  }

  .issue-meta-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;

    padding: 5px 9px;
    border-radius: 7px;

    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }

  .issue-meta-item i {
    font-size: 12px;
  }

  .due-today {
    background: #fff0f1;
    color: #c92a3a;
  }

  .due-date {
    background: #fff7df;
    color: #876500;
  }

  .assigned-you {
    background: #eef4ff;
    color: #356dcc;
  }

  /* ========================================
   FOOTER
======================================== */

  .issue-card-footer {
    display: flex;
    align-items: center;
    gap: 28px;

    margin-top: 17px;
    padding-top: 14px;

    border-top: 1px solid #f0f1f2;
  }

  .issue-person {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
  }

  .person-avatar {
    width: 30px;
    height: 30px;
    min-width: 30px;

    border-radius: 50%;
    background: #f1f3f5;
    color: #495057;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 12px;
    font-weight: 700;
  }

  .issue-person > div:last-child {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .person-label {
    color: #9aa0a6;
    font-size: 10px;
    font-weight: 600;
    line-height: 1.2;
  }

  .person-name {
    color: #343a40;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.4;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ========================================
   MOBILE
======================================== */

  @media (max-width: 576px) {
    .issue-card {
      padding: 15px;
      border-radius: 14px;
    }

    .issue-card-header {
      gap: 11px;
    }

    .issue-icon {
      width: 36px;
      height: 36px;
      min-width: 36px;
      border-radius: 10px;
    }

    .issue-icon .material-symbols-outlined {
      font-size: 19px;
    }

    .issue-title {
      font-size: 14px;
    }

    .issue-description {
      font-size: 13px;
      margin-top: 6px;
    }

    .issue-meta {
      margin-top: 10px;
      gap: 6px;
    }

    .issue-meta-item {
      font-size: 11px;
      padding: 5px 8px;
    }

    .issue-card-footer {
      gap: 15px;
      margin-top: 14px;
      padding-top: 12px;
    }

    .issue-person {
      flex: 1;
      min-width: 0;
    }

    .person-name {
      max-width: 120px;
    }
  }

  /* ========================================
   VERY SMALL PHONES
======================================== */

  @media (max-width: 380px) {
    .issue-card-footer {
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }

    .issue-person {
      width: 100%;
    }

    .person-name {
      max-width: none;
    }
  }
</style>

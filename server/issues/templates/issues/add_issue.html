{% load static %}
<!-- divider  -->

{% load static %}

<section class="form_page">
  <div class="row justify-content-center">
    <div class="col-12 col-md-10 col-xl-8">
      <!-- =====================================
           BACK
      ====================================== -->
      <a href="javascript:history.back()" class="form_back_button">
        <i class="bi bi-chevron-left"></i>
        <span>Back</span>
      </a>

      <!-- =====================================
           PAGE HEADER
      ====================================== -->
      <div class="dashboard_main_card mb-3">
        <div class="form_page_header mb-0">
          <div class="form_page_icon">
            <i class="{{ icon }}"></i>
          </div>

          <div>
            <div class="form_page_eyebrow">PROJECT</div>

            <h1 class="form_page_title">{{ page_title }}</h1>

            <p class="form_page_subtitle mb-0">{{ sub_title }}</p>
          </div>
        </div>
      </div>

      <form
        method="POST"
        action="{% url 'issues:save-issue' project.uuid %}"
        enctype="multipart/form-data"
      >
        {% csrf_token %}

        <!-- =====================================
             DETAILS
        ====================================== -->
        <section class="form_section">
          <div class="form_section_header">
            <div class="form_section_number">01</div>

            <div>
              <h5 class="form_section_title">{{ section_text }} Details</h5>

              <p class="form_section_subtitle mb-0">
                Add the details for this {{ section_text|lower }}.
              </p>
            </div>
          </div>

          <div class="row g-4">
            <!-- TITLE -->
            <div class="col-12">
              <div class="form_field">
                <label for="issueTitle" class="form_field_label">
                  Title
                  <span class="required">*</span>
                </label>

                <input
                  type="text"
                  class="form-control modern_form_input inputs_css_style"
                  id="issueTitle"
                  name="title"
                  placeholder="e.g. Damaged site fence"
                  required
                />
              </div>
            </div>

            <!-- DESCRIPTION -->
            <div class="col-12">
              <div class="form_field">
                <label for="issueDescription" class="form_field_label">
                  {{ description_text }}
                </label>

                <textarea
                  class="form-control modern_form_input modern_form_textarea inputs_css_style"
                  id="issueDescription"
                  name="description"
                  rows="4"
                  placeholder="Add any relevant details..."
                ></textarea>
              </div>
            </div>

            <!-- PRIORITY -->
            <div class="col-12 col-md-4">
              <div class="form_field">
                <label for="priority" class="form_field_label">
                  Priority
                </label>

                <select
                  name="priority"
                  id="priority"
                  class="form-select modern_form_input inputs_css_style"
                >
                  <option value="high" selected>High</option>
                  <option value="medium">Medium</option>
                  <option value="low">Low</option>
                </select>
              </div>
            </div>

            <!-- TEAM MEMBER -->
            <div class="col-12 col-md-4">
              <div class="form_field">
                <label for="teamMember" class="form_field_label">
                  Assign Team Member
                </label>

                <select
                  name="team_id"
                  id="teamMember"
                  class="form-select modern_form_input inputs_css_style"
                >
                  <option selected value="None">Unassigned</option>

                  {% for data in team_members %}

                  <option value="{{ data.id }}">
                    {{ data.first_name }} {{ data.last_name }}
                  </option>

                  {% endfor %}
                </select>
              </div>
            </div>

            <!-- CONTRACTOR -->
            <div class="col-12 col-md-4">
              <div class="form_field">
                <label for="contractor" class="form_field_label">
                  Assign Contractor
                </label>

                <select
                  name="contractor_id"
                  id="contractor"
                  class="form-select modern_form_input inputs_css_style"
                >
                  <option selected value="None">None</option>

                  {% for data in contractors %}

                  <option value="{{ data.id }}">{{ data.name }}</option>

                  {% endfor %}
                </select>
              </div>
            </div>

            <!-- DUE DATE -->
            <div class="col-12">
              <div class="form_field">
                <label for="dueDate" class="form_field_label">
                  Due Date
                  <span class="required">*</span>
                </label>

                <div class="form_date_wrapper">
                  <i class="bi bi-calendar3"></i>

                  <input
                    type="date"
                    class="form-control modern_form_input form_date_input inputs_css_style"
                    id="dueDate"
                    name="due_date"
                    value="{{ today|date:'Y-m-d' }}"
                    required
                    onfocus="this.showPicker()"
                    onclick="this.showPicker()"
                  />
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- =====================================================
           05 — PHOTOS
      ====================================================== -->

        <section class="incident_form_section">
          <div class="incident_section_header">
            <div class="incident_section_number">02</div>

            <div>
              <h2>Photos</h2>
              <p>
                Attach photos that help explain the {{ section_text|lower }}.
              </p>
            </div>
          </div>

          <input
            type="file"
            name="attachments"
            id="attachments-issue"
            class="d-none"
            accept="image/*"
            multiple
          />

          <div
            id="attachment-preview-issue"
            class="incident_photo_preview row g-2 mb-3"
          ></div>

          <label for="attachments-issue" class="incident_upload">
            <div class="incident_upload_icon">
              <i class="bi bi-camera"></i>
            </div>

            <div class="incident_upload_content">
              <strong> Add {{ section_text|lower }} photos </strong>

              <span> Take photos or choose images from your device </span>

              <small id="incident_file_count"> No photos selected </small>
            </div>

            <i class="bi bi-plus-lg incident_upload_plus"></i>
          </label>
        </section>

        <!-- =====================================
             SAVE TYPE
        ====================================== -->
        <input type="hidden" value="{{ section_text }}" name="save_type" />

        <!-- =====================================
             ACTIONS
        ====================================== -->
        <div class="form_actions">
          <button
            type="button"
            onclick="history.back()"
            class="form_cancel_button"
          >
            Cancel
          </button>

          <button type="submit" class="form_save_button">
            <i class="bi bi-check-lg"></i>
            {{ save_btn }}
          </button>
        </div>
      </form>
    </div>
  </div>
</section>

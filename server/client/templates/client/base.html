    <!-- HIGHLIGHT SCRIPT  -->
    <script>
      function handlePageAnchor() {
        const hash = window.location.hash;

        if (!hash) {
          return;
        }

        const element = document.querySelector(hash);

        if (!element) {
          return;
        }

        // Scroll to target
        element.scrollIntoView({
          behavior: "smooth",
          block: "center",
        });

        // Restart highlight animation
        element.classList.remove("issue-highlight");

        void element.offsetWidth;

        element.classList.add("issue-highlight");

        // Remove highlight after 3 seconds
        setTimeout(function () {
          element.classList.remove("issue-highlight");
        }, 3000);
      }

      // Full page load
      document.addEventListener("DOMContentLoaded", function () {
        handlePageAnchor();
      });

      // HTMX navigation
      document.body.addEventListener("htmx:afterSettle", function (event) {
        if (event.detail.target.id !== "content") {
          return;
        }

        handlePageAnchor();
      });
    </script>

    <!-- LOAD ATTACHMENTS SCRIPT  -->
    <script>
      function initIssueAttachments() {
        const attachmentInput = document.getElementById("attachments-issue");
        const attachmentPreview = document.getElementById(
          "attachment-preview-issue",
        );

        // Element isn't on the current page
        if (!attachmentInput || !attachmentPreview) {
          return;
        }

        // Prevent initializing the same input multiple times
        if (attachmentInput.dataset.initialized === "true") {
          return;
        }

        attachmentInput.dataset.initialized = "true";

        let selectedFiles = [];

        // ==========================================
        // Select Photos
        // ==========================================

        attachmentInput.addEventListener("change", function () {
          const newFiles = Array.from(this.files);

          selectedFiles = [...selectedFiles, ...newFiles];

          updateInputFiles();
          renderPreviews();
        });

        // ==========================================
        // Update Actual File Input
        // ==========================================

        function updateInputFiles() {
          const dataTransfer = new DataTransfer();

          selectedFiles.forEach(function (file) {
            dataTransfer.items.add(file);
          });

          attachmentInput.files = dataTransfer.files;
        }

        // ==========================================
        // Render Photo Previews
        // ==========================================

        function renderPreviews() {
          attachmentPreview.innerHTML = "";

          selectedFiles.forEach(function (file, index) {
            const col = document.createElement("div");

            col.className = "col-4";

            const reader = new FileReader();

            reader.onload = function (event) {
              col.innerHTML = `
            <div
              class="position-relative"
              style="aspect-ratio: 1 / 1;"
            >

              <img
                src="${event.target.result}"
                class="w-100 h-100 rounded object-fit-cover report_image"
                alt="${file.name}"
              >

              <button
                type="button"
                class="btn btn-dark btn-sm position-absolute top-0 end-0 m-1 rounded-circle"
                data-index="${index}"
                aria-label="Remove photo"
              >
                <i class="bi bi-x-lg"></i>
              </button>

            </div>
          `;

              col
                .querySelector("button")
                .addEventListener("click", function () {
                  const fileIndex = parseInt(this.dataset.index);

                  selectedFiles.splice(fileIndex, 1);

                  updateInputFiles();
                  renderPreviews();
                });
            };

            reader.readAsDataURL(file);

            attachmentPreview.appendChild(col);
          });
        }
      }

      // ==========================================
      // Normal Page Load
      // ==========================================

      document.addEventListener("DOMContentLoaded", function () {
        initIssueAttachments();
      });

      // ==========================================
      // HTMX Page Load
      // ==========================================

      document.body.addEventListener("htmx:afterSwap", function (event) {
        initIssueAttachments();
      });
    </script>

    <!-- ADD DELIVERY SCRIPT  -->
    <script>
      let deliveryItemCount = 0;

      function addDeliveryItem(containerId) {
        const deliveryItemsContainer = document.getElementById(containerId);

        if (!deliveryItemsContainer) return;

        deliveryItemCount++;

        const item = document.createElement("div");

        item.classList.add("delivery-item", "border", "rounded", "p-3", "mb-3");

        item.innerHTML = `
      <div class="d-flex justify-content-between align-items-center mb-3">
        <strong>Delivery Item ${deliveryItemCount}</strong>

        <button
          type="button"
          class="btn btn-sm btn-outline-danger remove-delivery-item"
        >
          <i class="bi bi-trash"></i>
        </button>
      </div>

      <div class="mb-3">
        <label class="form-label">
          What Was Delivered?
        </label>

        <input
          type="text"
          name="delivery_item[]"
          class="form-control"
          placeholder="e.g. Bricks"
          required
        >
      </div>

      <div class="row">

        <div class="col-md-6 mb-3">
          <label class="form-label">
            Quantity
          </label>

          <input
            type="number"
            name="delivery_quantity[]"
            class="form-control"
            min="0"
            step="0.01"
            placeholder="e.g. 500"
            required
          >
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">
            Unit
          </label>

          <select
            name="delivery_unit[]"
            class="form-select"
            required
          >
            <option value="">Select unit</option>
            <option value="units">Units</option>
            <option value="bags">Bags</option>
            <option value="boxes">Boxes</option>
            <option value="pallets">Pallets</option>
            <option value="loads">Loads</option>
            <option value="metres">Metres</option>
            <option value="tonnes">Tonnes</option>
            <option value="litres">Litres</option>
            <option value="other">Other</option>
          </select>
        </div>

      </div>
    `;

        deliveryItemsContainer.appendChild(item);
      }

      // Remove delivery item
      document.addEventListener("click", function (event) {
        const button = event.target.closest(".remove-delivery-item");

        if (!button) return;

        button.closest(".delivery-item")?.remove();
      });
    </script>
